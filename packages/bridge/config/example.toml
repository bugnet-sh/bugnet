# Every bridge setting, each at its default. The bridge reads ~/.config/bugnet/mcp.toml when it
# exists, or the file --config names, and --gateway overrides gateway_url. It holds no secrets.
# Durations take ms, s, m or h.

gateway_url = "https://mcp.bugnet.sh/mcp"   # remote Bugnet MCP gateway, https or loopback http
secrets_url = "https://secrets.bugnet.sh"   # secrets route that takes sealed values, https or loopback http
connect_timeout = "10s"                     # longest wait to reach the gateway and list its tools
call_timeout = "5m"                         # longest wait for one tool call, reset by progress
secrets_timeout = "30s"                     # longest wait for one call to the secrets route
