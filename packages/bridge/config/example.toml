# Every bridge setting, each at its default. The bridge reads ~/.config/bugnet/mcp.toml when it
# exists, or the file --config names, and --gateway overrides gateway_url. It holds no secrets.
# Durations take ms, s, m or h.

gateway_url = "https://mcp.bugnet.sh/mcp"   # remote Bugnet MCP gateway, https or loopback http
secrets_url = "https://secrets.bugnet.sh"   # secrets route for sealed values, https or loopback http
connect_timeout = "5s"                      # longest wait to reach the gateway, Codex allows 10 s to start
call_timeout = "5m"                         # longest wait for one tool call, reset by progress
secrets_timeout = "30s"                     # longest wait for one call to the secrets route
pay_command = "pay"                         # the pay CLI that pays from this machine, "" turns it off
pay_origin = "https://pay.bugnet.sh"        # the only origin the bridge and pay will pay, https or loopback http
pay_link_dialog = false                     # true opens pay links in the client's URL dialog, which waits for a click
